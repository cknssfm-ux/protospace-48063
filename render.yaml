# Render の Blueprint（DB と Web サービスを無料プランでまとめて作る）
# 秘密の値は手で入れない：DATABASE_URL は DB から、SECRET_KEY_BASE は Render が作る
databases:
  - name: protospace_production
    databaseName: protospace_production
    user: protospace
    plan: free
    region: oregon

services:
  - type: web
    name: protospace-48063
    runtime: ruby
    plan: free
    region: oregon
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protospace_production
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
